<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Stone-Paper-Scixer</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Rock Paper Scissors</h1>
        <div class="choices_cs">
            <div class="choice_cs " id="rock">
                <img src="/images/rock.png" alt>
            </div>
            <div class="choice_cs" id="paper">
                <img src="/images/paper.png" alt>
            </div>
            <div class="choice_cs" id="scissors">
                <img src="/images/scissors.png" alt>
            </div>
        </div>

        <div class="score_board_cs">
            <div class="score_cs">
                <p id="user_score_cs">0</p>
                <p>You</p>
            </div>
            <div class="score_cs">
                <p id="comp_score_cs">0</p>
                <p>Comp</p>
            </div>
        </div>
        <div class="msg_container_cs">
            <p class="msg_cs">Play Your Move</p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
